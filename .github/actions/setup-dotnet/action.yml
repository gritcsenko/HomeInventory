name: Setup .NET SDK
description: Install the SDK version declared in src/HomeInventory/global.json.

runs:
  using: composite
  steps:
    - name: Read SDK version
      id: sdk
      shell: bash
      run: |
        version="$(node -p "require('./src/HomeInventory/global.json').sdk.version")"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - name: Install .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        # rollForward latestMajor is resolved to the LTS channel and can install
        # an SDK older than sdk.version. Pass the declared version explicitly.
        # https://github.com/actions/setup-dotnet/issues/802
        dotnet-version: ${{ steps.sdk.outputs.version }}
